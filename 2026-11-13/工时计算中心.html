var PLAT_TAG = {'网批2.0':'tag-wp','集采平台':'tag-jc','分销平台':'tag-fx'};
var PLAT_COLOR = {'网批2.0':'#1d4ed8','集采平台':'#16a34a','分销平台':'#d97706'};
var RC = {'后端':'#10b981','前端':'#db2777','移动':'#ea580c','测试':'#0284c7','产品':'#7c3aed'};

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function quarterColor(q){
  var map = {'Q1':'#6366f1','Q2':'#0ea5e9','Q3':'#f59e0b','Q4':'#10b981'};
  var qq = q.slice(-2);
  return map[qq] || '#888';
}

var curSel = null;

function render(){
  var p = document.getElementById('f-platform').value;
  var st = document.getElementById('f-status').value;
  var q = document.getElementById('f-quarter').value;
  var v = document.getElementById('f-version').value;
  var name = document.getElementById('f-name').value.trim().toLowerCase();
  var story = document.getElementById('f-story').value.trim();
  var sort = document.getElementById('f-sort').value;

  var list = ROWS.filter(function(r){
    if (p && r.platform !== p) return false;
    if (st && r.status !== st) return false;
    if (q && r.quarter !== q) return false;
    if (v && String(r.eid) !== v) return false;
    if (name && r.name.toLowerCase().indexOf(name) < 0) return false;
    if (story) {
      var ids = r.story_ids || [];
      if (ids.indexOf(Number(story)) < 0) return false;
    }
    return true;
  });

  if (sort === 'time') list.sort(function(a,b){return (b.end||b.begin||'').localeCompare(a.end||a.begin||'');});
  else if (sort === 'eid') list.sort(function(a,b){return b.eid - a.eid;});
  else if (sort === 'begin') list.sort(function(a,b){return (b.begin||'').localeCompare(a.begin||'');});
  else if (sort === 'name') list.sort(function(a,b){return a.name.localeCompare(b.name,'zh');});

  document.getElementById('f-count').textContent = '筛选出 ' + list.length + ' / ' + ROWS.length + ' 个迭代';

  var tb = document.getElementById('tbody');
  var html = '';
  list.forEach(function(r){
    var prog = parseFloat(r.progress) || 0;
    var pcolor = prog >= 90 ? '#52c41a' : (prog >= 50 ? '#faad14' : '#f5222d');
    var stTag = r.status === 'closed' ? '<span class="tag st-closed">已关闭</span>' : '<span class="tag st-active">进行中</span>';
    var qc = quarterColor(r.quarter);
    var sel = (curSel === r.eid) ? ' class="sel"' : '';
    html += '<tr data-eid="' + r.eid + '" style="cursor:pointer;"' + sel + '>'
      + '<td><b>#' + r.eid + '</b></td>'
      + '<td class="name-cell" title="' + escapeHtml(r.name) + '">' + escapeHtml(r.name) + '</td>'
      + '<td><span class="tag ' + (PLAT_TAG[r.platform]||'') + '">' + r.platform + '</span></td>'
      + '<td>' + stTag + '</td>'
      + '<td style="font-size:12px;color:#888;">' + (r.begin||'-') + ' ~ ' + (r.end||'-') + '</td>'
      + '<td><span style="font-size:12px;font-weight:700;color:' + qc + ';">' + (r.quarter||'-') + '</span></td>'
      + '<td><div style="width:80px;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;"><div style="height:100%;width:' + prog + '%;background:' + pcolor + ';"></div></div> <span style="font-size:12px;color:#666;">' + prog + '%</span></td>'
      + '<td style="color:#667eea;font-weight:600;">' + (r.n_stories||0) + '</td>'
      + '</tr>';
  });
  tb.innerHTML = html;

  tb.querySelectorAll('tr[data-eid]').forEach(function(tr){
    tr.addEventListener('click', function(){
      showDetail(parseInt(tr.getAttribute('data-eid'), 10));
    });
  });

  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
}

function showDetail(eid){
  curSel = eid;
  var d = DETAILS[String(eid)];
  if (!d) { return; }
  // 高亮当前行
  document.querySelectorAll('#tbody tr').forEach(function(tr){
    tr.classList.toggle('sel', parseInt(tr.getAttribute('data-eid'),10) === eid);
  });

  var wrap = document.getElementById('detail-wrap');
  var head = '<div class="detail-head">'
    + '<div><div class="t">迭代 ' + eid + ' 需求工时表</div>'
    + '<div class="sub">' + escapeHtml(d.name || '') + ' · 生成时间 2026-11-13' + '</div></div>'
    + '<div style="display:flex;align-items:center;gap:12px;">'
    + '<a class="entry-btn" href="../重点需求.html">★ 查看重点需求</a>'
    + '<span class="focus-count" id="focus-count">已勾选 0 个重点需求</span>'
    + '</div></div>';

  wrap.innerHTML = head + d.cards + d.dist + d.body;
  wrap.style.display = 'block';

  // 绑定重点需求勾选
  bindFocus(eid, d.name || '');
  // 绑定排序
  bindSort();
  wrap.scrollIntoView({behavior:'smooth', block:'start'});
}

function bindFocus(eid, iterName){
  var PREFIX = 'key_story_' + eid + '_';
  function focusKey(sid){ return PREFIX + sid; }
  function updateCount(){
    var n = 0;
    document.querySelectorAll('#detail-wrap .focus-chk').forEach(function(c){ if(c.checked) n++; });
    var el = document.getElementById('focus-count');
    if (el) el.textContent = '已勾选 ' + n + ' 个重点需求';
  }
  document.querySelectorAll('#detail-wrap .focus-chk').forEach(function(cb){
    var sid = cb.getAttribute('data-sid');
    cb.checked = localStorage.getItem(focusKey(sid)) !== null;
    cb.addEventListener('change', function(){
      if (cb.checked) {
        var payload = {
          eid: String(eid), iter_name: iterName, sid: sid,
          title: cb.getAttribute('data-title'),
          hours: JSON.parse(cb.getAttribute('data-hours') || '{}')
        };
        localStorage.setItem(focusKey(sid), JSON.stringify(payload));
      } else {
        localStorage.removeItem(focusKey(sid));
      }
      var tr = cb.closest('tr');
      if (tr) tr.classList.toggle('focused', cb.checked);
      updateCount();
    });
    var tr = cb.closest('tr');
    if (tr && cb.checked) tr.classList.add('focused');
  });
  updateCount();
}

function bindSort(){
  document.querySelectorAll('#detail-wrap table').forEach(function(table){
    var tbody = table.tBodies[0];
    if (!tbody) return;
    table.querySelectorAll('th.sortable').forEach(function(th){
      th.addEventListener('click', function(){
        var col = parseInt(th.getAttribute('data-col'), 10);
        var type = th.getAttribute('data-type');
        var dir = th.getAttribute('data-dir') === 'asc' ? 'desc' : 'asc';
        table.querySelectorAll('th.sortable').forEach(function(h){ h.removeAttribute('data-dir'); });
        th.setAttribute('data-dir', dir);
        var rows = Array.prototype.slice.call(tbody.rows);
        rows.sort(function(a, b){
          var ca = a.cells[col].innerText.trim();
          var cb = b.cells[col].innerText.trim();
          if (type === 'num') {
            var va = parseFloat(ca), vb = parseFloat(cb);
            var ea = isNaN(va), eb = isNaN(vb);
            if (ea && eb) return 0;
            if (ea) return 1;
            if (eb) return -1;
            return dir === 'asc' ? va - vb : vb - va;
          } else {
            return dir === 'asc' ? ca.localeCompare(cb, 'zh') : cb.localeCompare(ca, 'zh');
          }
        });
        rows.forEach(function(r){ tbody.appendChild(r); });
      });
    });
  });
}

document.getElementById('f-platform').addEventListener('change', render);
document.getElementById('f-status').addEventListener('change', render);
document.getElementById('f-quarter').addEventListener('change', render);
document.getElementById('f-version').addEventListener('change', render);
document.getElementById('f-sort').addEventListener('change', render);
document.getElementById('f-name').addEventListener('input', render);
document.getElementById('f-story').addEventListener('input', render);

render();
</script>
