name: 刷新禅道数据

on:
  schedule:
    - cron: '0,30 0-10 * * 1-5'
  repository_dispatch:
    types: [refresh-data]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (generate only)
        env:
          ZENTAO_ACCOUNT: ${{ secrets.ZENTAO_ACCOUNT }}
          ZENTAO_PASSWORD: ${{ secrets.ZENTAO_PASSWORD }}
        run: python scripts/pipeline.py --skip-push

      - name: Publish to GitHub
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: $(date +%Y-%m-%d) 禅道数据刷新"
            git push origin HEAD:main
            echo "Pushed successfully"
          fi
