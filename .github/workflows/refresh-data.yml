name: 刷新禅道数据

on:
  schedule:
    - cron: '0,30 0-10 * * 1-5'
  repository_dispatch:
    types: [refresh-data]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create trigger file
        run: |
          mkdir -p .triggers
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .triggers/$(date +%s).json

      - name: Commit & push trigger
        run: |
          git config user.name "Refresh Bot"
          git config user.email "bot@refresh.local"
          git add .triggers/
          git commit -m "trigger: refresh $(date +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin HEAD:main || true
