name: 刷新禅道数据

on:
  schedule:
    - cron: '0,30 0-10 * * 1-5'
  repository_dispatch:
    types: [refresh-data]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run full pipeline
        env:
          ZENTAO_ACCOUNT: ${{ secrets.ZENTAO_ACCOUNT }}
          ZENTAO_PASSWORD: ${{ secrets.ZENTAO_PASSWORD }}
        run: |
          python C:/Users/gree/Desktop/AI工作场景/项目管理/_run_full_parallel.py
