name: 刷新禅道数据

on:
  repository_dispatch:
    types: [refresh-data]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅拉取不推送'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Run pipeline
        env:
          ZENTAO_ACCOUNT: ${{ secrets.ZENTAO_ACCOUNT }}
          ZENTAO_PASSWORD: ${{ secrets.ZENTAO_PASSWORD }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/pipeline.py

      - name: Summary
        if: always()
        run: |
          echo "## 禅道数据刷新完成" >> $GITHUB_STEP_SUMMARY
          echo "- 日期: $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "- 状态: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
