<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禅道任务报告 · 导航</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

.container {
    width: 100%;
    max-width: 900px;
}

/* ── Header ── */
.header {
    text-align: center;
    margin-bottom: 48px;
}
.header .logo {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
    animation: float 3s ease-in-out infinite;
}
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
.header h1 {
    font-size: 32px;
    font-weight: 700;
    background: linear-gradient(120deg, #667eea, #f093fb, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
}
.header .subtitle {
    color: #8892b0;
    font-size: 15px;
    letter-spacing: 1px;
}
.header .date-tag {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 13px;
    color: #a5b4fc;
    background: rgba(102, 126, 234, 0.12);
    border: 1px solid rgba(102, 126, 234, 0.25);
}

/* ── Card Grid ── */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

/* ── Card ── */
.card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 24px 30px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    backdrop-filter: blur(10px);
}
.card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 0;
}
.card:nth-child(1)::before { background: linear-gradient(135deg, rgba(102,126,234,0.25), rgba(240,147,251,0.15)); }
.card:nth-child(2)::before { background: linear-gradient(135deg, rgba(67,233,123,0.20), rgba(102,126,234,0.15)); }
.card:nth-child(3)::before { background: linear-gradient(135deg, rgba(240,147,251,0.25), rgba(79,172,254,0.15)); }
.card:nth-child(4)::before { background: linear-gradient(135deg, rgba(255,167,38,0.20), rgba(239,83,80,0.12)); }
.card:hover::before { opacity: 1; }
.card:hover {
    transform: translateY(-6px);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 20px 48px rgba(0,0,0,0.35);
}
.card:active { transform: translateY(-2px); }

.card .icon {
    font-size: 42px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}
.card .name {
    font-size: 17px;
    font-weight: 600;
    color: #e2e8f0;
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
}
.card .desc {
    font-size: 13px;
    color: #8892b0;
    position: relative;
    z-index: 1;
    text-align: center;
    line-height: 1.5;
}

/* ── Card colors ── */
.card.product .name { color: #a5b4fc; }
.card.backend  .name { color: #66eea6; }
.card.frontend .name { color: #f093fb; }
.card.mobile   .name { color: #ffa726; }

/* ── Footer ── */
.footer {
    text-align: center;
    margin-top: 40px;
    color: #4a5568;
    font-size: 12px;
    letter-spacing: 0.5px;
}
.footer a { color: #667eea; text-decoration: none; }
.footer a:hover { text-decoration: underline; }

/* ── Responsive ── */
@media (max-width: 500px) {
    .header h1 { font-size: 24px; }
    .card { padding: 28px 16px 22px; }
    .card .icon { font-size: 34px; }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <span class="logo">📊</span>
        <h1>禅道任务报告中心</h1>
        <p class="subtitle">Zentao Task Dashboard</p>
        <span class="date-tag">2026-05-22</span>
    </div>

    <div class="grid">

        <!-- 产品任务 / AB 类型 -->
        <a href="未完成ab类型任务_可视化报告.html" class="card product" target="_blank">
            <span class="icon">📋</span>
            <span class="name">产品任务</span>
            <span class="desc">需求 / AB 类型<br>未完成任务明细</span>
        </a>

        <!-- 后端开发 -->
        <a href="未完成后端开发任务_详细任务.html" class="card backend" target="_blank">
            <span class="icon">⚙️</span>
            <span class="name">后端开发</span>
            <span class="desc">后端开发任务<br>工时 & 状态追踪</span>
        </a>

        <!-- 前端开发 -->
        <a href="未完成前端开发任务_详细任务.html" class="card frontend" target="_blank">
            <span class="icon">🎨</span>
            <span class="name">前端开发</span>
            <span class="desc">前端开发任务<br>工时 & 状态追踪</span>
        </a>

        <!-- 移动端开发 -->
        <a href="未完成移动端开发任务_详细任务.html" class="card mobile" target="_blank">
            <span class="icon">📱</span>
            <span class="name">移动端开发</span>
            <span class="desc">移动端开发任务<br>工时 & 状态追踪</span>
        </a>

    </div>

    <div class="footer">
        数据来源：禅道管理系统 &nbsp;|&nbsp;
        <a href="https://github.com/Yang-chad/tasks" target="_blank">GitHub Tasks</a>
    </div>

</div>

</body>
</html>
