var PLAT_TAG = {'网批2.0':'tag-wp','集采平台':'tag-jc','分销平台':'tag-fx'};
var PLAT_COLOR = {'网批2.0':'#1d4ed8','集采平台':'#16a34a','分销平台':'#d97706'};

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function quarterColor(q){
  var map = {'Q1':'#6366f1','Q2':'#0ea5e9','Q3':'#f59e0b','Q4':'#10b981'};
  var qq = q.slice(-2);
  return map[qq] || '#888';
}

function render(){
  var p = document.getElementById('f-platform').value;
  var st = document.getElementById('f-status').value;
  var q = document.getElementById('f-quarter').value;
  var name = document.getElementById('f-name').value.trim().toLowerCase();
  var sort = document.getElementById('f-sort').value;

  var list = ROWS.filter(function(r){
    if (p && r.platform !== p) return false;
    if (st && r.status !== st) return false;
    if (q && r.quarter !== q) return false;
    if (name && r.name.toLowerCase().indexOf(name) < 0 && String(r.eid).indexOf(name) < 0) return false;
    return true;
  });

  if (sort === 'eid') list.sort(function(a,b){return b.eid - a.eid;});
  else if (sort === 'begin') list.sort(function(a,b){return (b.begin||'').localeCompare(a.begin||'');});
  else if (sort === 'name') list.sort(function(a,b){return a.name.localeCompare(b.name,'zh');});

  document.getElementById('f-count').textContent = '筛选出 ' + list.length + ' / ' + ROWS.length + ' 个迭代';

  var tb = document.getElementById('tbody');
  var html = '';
  list.forEach(function(r){
    var prog = parseFloat(r.progress) || 0;
    var pcolor = prog >= 90 ? '#52c41a' : (prog >= 50 ? '#faad14' : '#f5222d');
    var stTag = r.status === 'closed' ? '<span class="tag st-closed">已关闭</span>' : '<span class="tag st-active">进行中</span>';
    var qc = quarterColor(r.quarter);
    html += '<tr>'
      + '<td><a href="迭代' + r.eid + '_工时计算.html">#' + r.eid + '</a></td>'
      + '<td class="name-cell" title="' + escapeHtml(r.name) + '">' + escapeHtml(r.name) + '</td>'
      + '<td><span class="tag ' + (PLAT_TAG[r.platform]||'') + '">' + r.platform + '</span></td>'
      + '<td>' + stTag + '</td>'
      + '<td style="font-size:12px;color:#888;">' + (r.begin||'-') + ' ~ ' + (r.end||'-') + '</td>'
      + '<td><span style="font-size:12px;font-weight:700;color:' + qc + ';">' + (r.quarter||'-') + '</span></td>'
      + '<td><div style="width:90px;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;"><div style="height:100%;width:' + prog + '%;background:' + pcolor + ';"></div></div> <span style="font-size:12px;color:#666;">' + prog + '%</span></td>'
      + '<td><a href="迭代' + r.eid + '_工时计算.html">查看工时 →</a></td>'
      + '</tr>';
  });
  tb.innerHTML = html;
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
}

document.getElementById('f-platform').addEventListener('change', render);
document.getElementById('f-status').addEventListener('change', render);
document.getElementById('f-quarter').addEventListener('change', render);
document.getElementById('f-sort').addEventListener('change', render);
document.getElementById('f-name').addEventListener('input', render);

render();
</script>
